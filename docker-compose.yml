services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recruiting_tool_db
      TZ: America/Argentina/Buenos_Aires
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: recruiting_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8080:80'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

  backend:
    build:
      context: ./recruiting-tool-backend
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./recruiting-tool-backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/recruiting_tool_db
    volumes:
      - ./recruiting-tool-backend:/app
    networks:
      - app-network
    entrypoint: ['/bin/sh', '/app/docker-entrypoint.sh']
    command: ['yarn', 'run', 'start']

  frontend:
    build:
      context: ./recruiting-tool-frontend
      dockerfile: Dockerfile
    env_file:
      - ./recruiting-tool-frontend/.env
    ports:
      - '${VITE_PORT:-5137}:80'
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
