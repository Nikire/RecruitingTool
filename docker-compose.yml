services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recruiting_tool_db
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: recruiting_pgadmin
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: recruiting_pgbouncer
    profiles: [tools]
    environment:
      # PostgreSQL connection
      - DATABASES_HOST=db
      - DATABASES_PORT=5432
      - DATABASES_USER=${POSTGRES_USER}
      - DATABASES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASES_DBNAME=recruiting_tool_db
      # PgBouncer pooling configuration
      # transaction mode: Best for Prisma and stateless applications
      # Connections are returned to pool after each transaction
      - PGBOUNCER_POOL_MODE=transaction
      # Maximum client connections allowed
      - PGBOUNCER_MAX_CLIENT_CONN=100
      # Default pool size per database
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      # Minimum pool size to keep alive
      - PGBOUNCER_MIN_POOL_SIZE=5
      # Reserve pool for high-priority connections
      - PGBOUNCER_RESERVE_POOL_SIZE=5
      # Maximum database connections
      - PGBOUNCER_MAX_DB_CONNECTIONS=20
      # Enable verbose logging for debugging (disable in production)
      - PGBOUNCER_VERBOSE=0
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "localhost",
          "-p",
          "6432",
          "-U",
          "${POSTGRES_USER}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./recruiting-tool-backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      db:
        condition: service_healthy
      # Uncomment to use PgBouncer in production (recommended for high-load scenarios)
      # pgbouncer:
      #   condition: service_healthy
    env_file:
      - ./recruiting-tool-backend/.env
    environment:
      # Database connection with connection pooling
      # OPTION 1: Direct connection to PostgreSQL (current setup)
      # connection_limit: Max connections (20 for production Docker environment)
      # pool_timeout: Timeout in seconds for acquiring connection (15s)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/recruiting_tool_db?schema=public&connection_limit=20&pool_timeout=15
      # OPTION 2: Use PgBouncer for advanced pooling (recommended for production)
      # Uncomment below and comment out the line above to use PgBouncer
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/recruiting_tool_db?schema=public
      - TS_NODE_TRANSPILE_ONLY=1
      # Override NODE_ENV to install devDependencies (ts-node, tsconfig-paths)
      - NODE_ENV=development
    volumes:
      - ./recruiting-tool-backend:/app
      - backend_node_modules:/app/node_modules
      - backup_data:/backups
    networks:
      - app-network
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    command:
      [
        "node",
        "-r",
        "ts-node/register",
        "-r",
        "tsconfig-paths/register",
        "src/main.ts",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/nikire/borderless-frontend:latest
    build:
      context: ./recruiting-tool-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
    env_file:
      - ./recruiting-tool-frontend/.env
    ports:
      - "${VITE_PORT:-5137}:80"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: recruiting_minio
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - app-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: borderless-n8n
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5678/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: borderless-stripe-cli
    profiles: [stripe]
    restart: unless-stopped
    command:
      - listen
      - --api-key
      - ${STRIPE_SECRET_KEY}
      - --forward-to
      - http://backend:4000/api/stripe/webhook
      - --skip-verify
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    # Note: The webhook signing secret will be displayed in logs on startup
    # Use: docker logs borderless-stripe-cli to see it

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  minio_data:
  n8n_data:
  backup_data:
  backend_node_modules:
