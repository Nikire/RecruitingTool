name: Stale Issue Management

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ github.token }}

          # Issue configuration
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity in the last 90 days.

            **Next steps:**
            - If this issue is still relevant, please comment to keep it open
            - Otherwise, it will be automatically closed in 14 days

            Thank you for your contributions!
          close-issue-message: |
            This issue was automatically closed because it has been stale for 14 days with no activity.

            If you believe this issue should be reopened, please create a new issue with updated context and reference this one.
          stale-issue-label: 'stale'

          # PR configuration
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity in the last 30 days.

            **Next steps:**
            - If this PR is still being worked on, please comment or push new commits
            - Otherwise, it will be automatically closed in 7 days

            Thank you for your contributions!
          close-pr-message: |
            This pull request was automatically closed because it has been stale for 7 days with no activity.

            If you would like to continue this work, please reopen the PR or create a new one.
          stale-pr-label: 'stale'

          # Labels to exempt from stale automation
          exempt-issue-labels: 'pinned,security,priority-high,in development'
          exempt-pr-labels: 'pinned,security,priority-high'

          # Don't mark as stale if assigned to someone
          exempt-all-assignees: true

          # Operations per run (prevent rate limiting)
          operations-per-run: 30
