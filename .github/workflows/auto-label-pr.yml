name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Auto-label based on file paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          LABELS=""

          # Backend changes
          if echo "$FILES" | grep -q "recruiting-tool-backend/"; then
            LABELS="$LABELS backend"
          fi

          # Frontend changes
          if echo "$FILES" | grep -q "recruiting-tool-frontend/"; then
            LABELS="$LABELS frontend"
          fi

          # Database changes
          if echo "$FILES" | grep -q "schema.prisma\|migrations/"; then
            LABELS="$LABELS database"
          fi

          # Documentation changes
          if echo "$FILES" | grep -q "\.md$\|docs-vault/\|\.claude/docs/"; then
            LABELS="$LABELS documentation"
          fi

          # Docker/Infrastructure changes
          if echo "$FILES" | grep -q "docker-compose\|Dockerfile\|\.dockerignore"; then
            LABELS="$LABELS infrastructure"
          fi

          # GitHub workflows
          if echo "$FILES" | grep -q "\.github/workflows/"; then
            LABELS="$LABELS github-actions"
          fi

          # i18n changes
          if echo "$FILES" | grep -q "locales/\|i18n"; then
            LABELS="$LABELS i18n"
          fi

          # Add labels if any were found
          if [ -n "$LABELS" ]; then
            echo "Adding labels: $LABELS"
            for label in $LABELS; do
              gh pr edit ${{ github.event.pull_request.number }} --add-label "$label" || echo "Label '$label' may not exist yet"
            done
          else
            echo "No automatic labels to add"
          fi

      - name: Check for issue reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          # Check if PR references an issue
          HAS_ISSUE_REF=$(echo "$PR_TITLE $PR_BODY" | grep -i -E '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#[0-9]+' || echo "")

          # Extract issue number from branch name (e.g., feature/issue-123-description)
          BRANCH_ISSUE=$(echo "$BRANCH_NAME" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || echo "")

          if [ -z "$HAS_ISSUE_REF" ] && [ -n "$BRANCH_ISSUE" ]; then
            echo "⚠️ Branch references issue #$BRANCH_ISSUE but PR description doesn't link it"
            gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Reminder:** This PR appears to be related to issue #$BRANCH_ISSUE based on the branch name, but the issue is not linked in the description. Consider adding \`Closes #$BRANCH_ISSUE\` to the PR description to automatically close the issue when merged."
          elif [ -z "$HAS_ISSUE_REF" ] && [ -z "$BRANCH_ISSUE" ]; then
            echo "ℹ️ No issue reference found in PR or branch name"
            gh pr comment ${{ github.event.pull_request.number }} --body "ℹ️ **Tip:** If this PR relates to an existing issue, add \`Closes #<issue-number>\` to the description to automatically link and close it when merged."
          fi
