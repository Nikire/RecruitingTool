name: Deploy to Development (EC2)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          timeout: 10m
          script: |
            set -e

            echo "==> Navigating to project directory..."
            cd ~/borderless

            echo "==> Pulling latest code from development branch..."
            git pull origin development

            echo "==> Disk usage before cleanup..."
            df -h /

            echo "==> Freeing up disk space (safe cleanup - keeps images and volumes)..."
            docker container prune -f || true
            docker builder prune -f || true

            echo "==> Pre-pulling base images to ensure they are available for builds..."
            docker pull node:20-alpine || true

            echo "==> Disk usage after cleanup..."
            df -h /

            echo "==> Resolving any failed Prisma migrations on DB..."
            DB_USER=$(docker exec borderless-db-1 sh -c 'echo $POSTGRES_USER' 2>/dev/null || echo "postgres")
            docker exec borderless-db-1 psql -U "$DB_USER" -d recruiting_tool_db -c \
              "DELETE FROM _prisma_migrations WHERE migration_name LIKE '20260226%' AND finished_at IS NULL AND rolled_back_at IS NULL;" \
              2>/dev/null || echo "==> DB fix skipped (container not ready or no failed migrations)"

            echo "==> Ensuring SELinux allows nginx → Docker connections..."
            sudo setsebool -P httpd_can_network_connect 1 || true

            echo "==> Building backend (sequential to avoid layer cache conflicts)..."
            DOCKER_BUILDKIT=0 docker-compose build backend

            echo "==> Building frontend..."
            DOCKER_BUILDKIT=0 docker-compose build frontend

            echo "==> Starting all containers..."
            docker-compose up -d

            echo "==> Waiting for containers to initialize..."
            sleep 30

            echo "==> Reloading nginx to pick up any config changes..."
            sudo systemctl reload nginx || true

            echo "==> Verifying container health..."
            docker-compose ps

            echo "==> Backend container logs (last 60 lines)..."
            docker logs borderless-backend-1 --tail=60 2>&1 || true

            echo "==> Smoke testing public endpoints..."
            curl -sf https://borderlessats.com > /dev/null \
              && echo "✅ Frontend: OK" \
              || echo "❌ Frontend: FAILED"
            curl -sf https://api.borderlessats.com/api/health/liveness > /dev/null \
              && echo "✅ Backend API: OK" \
              || echo "❌ Backend API: FAILED"

            echo "==> Disk usage after deploy..."
            df -h /

            echo "==> Deployment complete."

      - name: Send deployment notification email
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || 'changeme' }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          PAYLOAD=$(jq -n \
            --arg batch "$EMOJI EC2 Deployment – ${JOB_STATUS^^}" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" \
            --arg status "${JOB_STATUS^^}" \
            '{
              batchName: $batch,
              issues: [{ number: 0, title: ("[\($sha)] \($msg)"), status: $status }],
              testingChecklist: [
                "Frontend loads at https://borderlessats.com",
                "Backend health at https://api.borderlessats.com/api/health/liveness",
                "Spot-check recently pushed features"
              ],
              additionalNotes: ("Triggered by: \($actor)")
            }')

          curl -sf -X POST https://api.borderlessats.com/api/internal/batch-summary \
            -H "Content-Type: application/json" \
            -H "x-api-key: $INTERNAL_API_KEY" \
            -d "$PAYLOAD" \
          && echo "📧 Deployment notification sent." \
          || echo "⚠️ Notification failed (API may still be starting)"
