server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # --------------------------------------------------------------------------
  # Compression
  #
  # The public routes are now prerendered, so nginx serves real HTML instead of
  # a 2 kB empty shell: the landing page is ~300 kB of markup and inline
  # component CSS. The stock nginx image ships with gzip OFF, which would have
  # put all 300 kB on the wire uncompressed. It compresses to ~29 kB — and the
  # JS/CSS bundles benefit at least as much.
  # --------------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  # text/html is always compressed when gzip is on and must not be listed here.
  gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/rss+xml
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # --------------------------------------------------------------------------
  # Build assets — content-addressed filenames, so they can be cached forever.
  # --------------------------------------------------------------------------
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Logos, icons and the OG image live at the root without a content hash, so
  # they get a short cache rather than an immutable one.
  location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public";
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
  }

  # --------------------------------------------------------------------------
  # Pages
  #
  # Resolution order, and why each step exists:
  #
  #   1. $uri              — a real file (an asset, an image, sitemap.xml).
  #   2. $uri/index.html   — the PRERENDERED page for this route. `/careers`
  #                          resolves to `/careers/index.html` and is served
  #                          directly. Note this is NOT `try_files $uri/`: the
  #                          directory form makes nginx answer with a 301 to
  #                          `/careers/`, and every canonical URL the app emits
  #                          is slashless, so each one would cost a redirect.
  #   3. /spa-shell.html   — the EMPTY shell, for every route that is not
  #                          prerendered (/login, /jobs/*, the whole HR panel).
  #                          `index.html` cannot play this role any more: it is
  #                          the prerendered landing page, so serving it as the
  #                          catch-all would show home-page copy — under a
  #                          canonical pointing at `/` — on every unmatched URL.
  #   4. /index.html       — last-resort fallback for a build where the
  #                          prerender step was skipped or failed and no
  #                          `spa-shell.html` was emitted. In that build
  #                          `index.html` IS the empty shell, so the app still
  #                          boots normally on every route.
  #
  # HTML is served `no-cache` (revalidate every time): a deploy rewrites both
  # the markup and the hashed asset URLs it references, and a stale document
  # pointing at deleted bundles is a white screen.
  # --------------------------------------------------------------------------
  location / {
    try_files $uri $uri/index.html /spa-shell.html /index.html;
    add_header Cache-Control "no-cache";
  }
}
