<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/borderless-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Borderless ATS" />
    <meta
      name="description"
      content="Borderless ATS is a modern Applicant Tracking System for HR teams. Manage job positions, candidates, and multi-stage hiring workflows with AI-powered resume screening and automated interview scheduling."
    />
    <meta property="og:title" content="Borderless ATS" />
    <meta
      property="og:description"
      content="Modern recruiting platform for HR teams"
    />
    <meta property="og:image" content="/borderless-icon.png" />
    <meta property="og:type" content="website" />
    <title>Borderless ATS</title>
    <style>
      /*
        Visually hidden but accessible to crawlers — standard sr-only pattern.
        React does not touch this element (it is outside #root).
      */
      #static-meta {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Outside #root — React never replaces this.
      Visually hidden (sr-only) so users don't see it, but crawlers can read it.
    -->
    <div id="static-meta" aria-hidden="true">
      <h1>Borderless ATS</h1>
      <p>
        Borderless ATS is a modern Applicant Tracking System for HR teams.
        Manage job positions, candidates, and multi-stage hiring workflows with
        AI-powered resume screening and automated interview scheduling.
      </p>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
