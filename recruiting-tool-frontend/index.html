<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/borderless-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Borderless ATS" />
    <meta
      name="description"
      content="Borderless ATS is a modern Applicant Tracking System for HR teams. Manage job positions, candidates, and multi-stage hiring workflows with AI-powered resume screening and automated interview scheduling."
    />
    <meta property="og:title" content="Borderless ATS" />
    <meta
      property="og:description"
      content="Modern recruiting platform for HR teams"
    />
    <meta property="og:image" content="/borderless-icon.png" />
    <meta property="og:type" content="website" />
    <title>Borderless ATS</title>
    <style>
      /* Hide static footer once React mounts into #root */
      #root:not(:empty) ~ #static-footer { display: none; }
      #static-footer {
        font-family: sans-serif;
        font-size: 13px;
        color: #555;
        padding: 12px 20px;
        border-top: 1px solid #eee;
        text-align: center;
      }
      #static-footer a { color: #555; margin: 0 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static content outside #root — React does not replace this.
      Visible to crawlers that do not execute JavaScript.
      Hidden by CSS once React mounts (see style above).
    -->
    <footer id="static-footer">
      <strong>Borderless ATS</strong> — Modern Applicant Tracking System for HR teams.
      Manage job positions, candidates, and multi-stage hiring workflows with
      AI-powered resume screening and automated interview scheduling.
      <br />
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/contact">Contact</a>
    </footer>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
