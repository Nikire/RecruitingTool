<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/borderless-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Borderless ATS" />
    <!--
      DEFAULT head tags, for routes that are NOT prerendered — the auth screens,
      /jobs/* and everything behind the login. On those, this is what a crawler
      that does not run JavaScript sees; `<Seo>` replaces it in the browser.

      On a PRERENDERED route (see scripts/prerender/) the block below is stripped
      out at build time and replaced with that page's real title, description,
      canonical, Open Graph tags and JSON-LD. Keep it generic and brand-level:
      anything page-specific here would be wrong on most of the URLs it serves.
    -->
    <meta
      name="description"
      content="Borderless ATS is a modern Applicant Tracking System for HR teams. Manage job positions, candidates, and multi-stage hiring workflows with AI-powered resume screening and automated interview scheduling."
    />
    <meta property="og:title" content="Borderless ATS" />
    <meta
      property="og:description"
      content="Borderless ATS is a modern Applicant Tracking System for HR teams. Manage job positions, candidates, and multi-stage hiring workflows with AI-powered resume screening and automated interview scheduling."
    />
    <meta
      property="og:image"
      content="https://borderlessats.com/borderless-og.png"
    />
    <meta property="og:image:width" content="2581" />
    <meta property="og:image:height" content="802" />
    <meta property="og:image:alt" content="Borderless ATS" />
    <meta property="og:url" content="https://borderlessats.com/" />
    <meta property="og:site_name" content="Borderless ATS" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Borderless ATS" />
    <meta
      name="twitter:description"
      content="Borderless ATS is a modern Applicant Tracking System for HR teams. Manage job positions, candidates, and multi-stage hiring workflows with AI-powered resume screening and automated interview scheduling."
    />
    <meta
      name="twitter:image"
      content="https://borderlessats.com/borderless-og.png"
    />
    <title>Borderless ATS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
